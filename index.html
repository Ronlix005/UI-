<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wireframe iPhone 15 App</title>
    <meta name="description" content="Applicazione mobile wireframe in bianco e nero in formato iPhone 15 con navigazione tra Pagina 1 e Pagina 2." />
    <meta property="og:title" content="Wireframe iPhone 15 App" />
    <meta property="og:description" content="Applicazione mobile wireframe in bianco e nero in formato iPhone 15 con navigazione tra Pagina 1 e Pagina 2." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Tailwind CSS CDN for 100% standalone single-file compatibility (GitHub Pages, local, etc.) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .wireframe-grid {
        background-size: 20px 20px;
        background-image: 
          linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
      }
      .wireframe-dots {
        background-size: 24px 24px;
        background-image: radial-gradient(circle, rgba(0, 0, 0, 0.12) 1px, transparent 1px);
      }
      /* Smooth slide transitions */
      .page-slide {
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
      }
      .page-hidden-left {
        transform: translateX(-100%);
        opacity: 0;
        pointer-events: none;
      }
      .page-hidden-right {
        transform: translateX(100%);
        opacity: 0;
        pointer-events: none;
      }
      .page-visible {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
      }
    </style>
  </head>
  <body class="min-h-screen w-full bg-neutral-100 text-neutral-900 flex flex-col items-center justify-between p-3 sm:p-6 select-none font-sans wireframe-dots m-0">

    <!-- Header Toolbar Wireframe -->
    <header class="w-full max-w-5xl bg-white border-2 border-black rounded-lg p-3 sm:px-6 sm:py-3.5 mb-4 shadow-[3px_3px_0px_0px_#000] flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded border-2 border-black flex items-center justify-center bg-neutral-50 shadow-[2px_2px_0px_0px_#000]">
          <!-- Smartphone icon -->
          <svg class="w-4 h-4 text-black" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <rect width="14" height="20" x="5" y="2" rx="2" ry="2" />
            <path d="M12 18h.01" />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-sm font-bold tracking-tight uppercase">iPhone 15 Wireframe</span>
            <span class="text-[11px] font-mono border border-black px-1.5 py-0.2 rounded bg-neutral-100">
              393 × 852 pt
            </span>
          </div>
          <p class="text-xs text-neutral-600 font-mono">
            Stato: <span id="page-status" class="font-semibold text-black">Pagina 1 di 2</span>
          </p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-2 text-xs">
        <!-- Grid Toggle -->
        <button
          id="btn-toggle-grid"
          type="button"
          title="Mostra/Nascondi griglia wireframe"
          class="flex items-center gap-1.5 px-2.5 py-1.5 border-2 border-black rounded transition-all active:translate-x-0.5 active:translate-y-0.5 bg-black text-white shadow-[2px_2px_0px_0px_#888]"
        >
          <!-- Grid icon -->
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
          </svg>
          <span class="hidden sm:inline font-mono">Griglia</span>
        </button>

        <!-- Scale Controls -->
        <div class="flex items-center border-2 border-black rounded bg-white shadow-[2px_2px_0px_0px_#000] overflow-hidden">
          <button
            id="btn-zoom-out"
            type="button"
            class="px-2 py-1.5 hover:bg-neutral-100 border-r border-black"
            title="Riduci zoom"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" x2="16.65" y1="21" y2="16.65" />
              <line x1="8" x2="14" y1="11" y2="11" />
            </svg>
          </button>
          <span id="zoom-label" class="px-2.5 py-1 text-[11px] font-mono min-w-[50px] text-center">
            85%
          </span>
          <button
            id="btn-zoom-in"
            type="button"
            class="px-2 py-1.5 hover:bg-neutral-100 border-l border-black"
            title="Aumenta zoom"
          >
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" x2="16.65" y1="21" y2="16.65" />
              <line x1="11" x2="11" y1="8" y2="14" />
              <line x1="8" x2="14" y1="11" y2="11" />
            </svg>
          </button>
        </div>

        <!-- Reset Zoom -->
        <button
          id="btn-zoom-reset"
          type="button"
          class="p-1.5 border-2 border-black rounded bg-white shadow-[2px_2px_0px_0px_#000] hover:bg-neutral-100 active:translate-x-0.5 active:translate-y-0.5"
          title="Reimposta scala predefinita"
        >
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Viewport Workspace: iPhone 15 frame -->
    <main class="flex-1 w-full flex items-center justify-center overflow-auto py-2">
      <div 
        id="iphone-wrapper"
        style="transform: scale(0.85); transform-origin: center center; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);"
        class="relative select-none"
      >
        <!-- Hardware Physical Buttons (Left & Right) -->
        <div class="absolute -left-[5px] top-[115px] w-[5px] h-[28px] bg-neutral-900 border-y border-l border-black rounded-l-sm"></div>
        <div class="absolute -left-[5px] top-[160px] w-[5px] h-[50px] bg-neutral-900 border-y border-l border-black rounded-l-sm"></div>
        <div class="absolute -left-[5px] top-[225px] w-[5px] h-[50px] bg-neutral-900 border-y border-l border-black rounded-l-sm"></div>
        <div class="absolute -right-[5px] top-[180px] w-[5px] h-[75px] bg-neutral-900 border-y border-r border-black rounded-r-sm"></div>

        <!-- iPhone 15 Outer Chassis Frame (393 x 852 pt) -->
        <div class="w-[393px] h-[852px] bg-white rounded-[54px] border-[10px] border-black shadow-[8px_8px_0px_0px_#000] relative overflow-hidden flex flex-col">
          
          <!-- Screen Inner Bezel Border -->
          <div class="absolute inset-0 rounded-[44px] pointer-events-none border-2 border-black z-40"></div>

          <!-- Top Status Bar & Dynamic Island Area -->
          <div class="relative z-30 pt-3 px-7 pb-2 flex items-center justify-between bg-white border-b border-black/10 select-none">
            <!-- Time -->
            <span class="text-[14px] font-bold tracking-tight font-mono text-black">
              9:41
            </span>

            <!-- Dynamic Island (iPhone 15) -->
            <div class="absolute left-1/2 -translate-x-1/2 top-2.5 w-[122px] h-[34px] bg-black rounded-full flex items-center justify-between px-3.5 shadow-sm">
              <div class="w-3 h-3 rounded-full border border-neutral-700 bg-neutral-950 flex items-center justify-center">
                <div class="w-1 h-1 rounded-full bg-neutral-800"></div>
              </div>
              <div class="w-2.5 h-2.5 rounded-full border border-neutral-800 bg-neutral-900"></div>
            </div>

            <!-- Status Icons -->
            <div class="flex items-center gap-1.5 text-black">
              <!-- Cellular Signal Wireframe -->
              <div class="flex items-end gap-[1.5px] h-3">
                <span class="w-[2.5px] h-1.5 bg-black rounded-[0.5px]"></span>
                <span class="w-[2.5px] h-2 bg-black rounded-[0.5px]"></span>
                <span class="w-[2.5px] h-2.5 bg-black rounded-[0.5px]"></span>
                <span class="w-[2.5px] h-3 bg-black rounded-[0.5px]"></span>
              </div>
              <!-- Wifi Icon -->
              <svg class="w-3.5 h-3.5 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" />
              </svg>
              <!-- Battery Icon -->
              <div class="flex items-center">
                <div class="w-5 h-2.5 rounded-[3px] border border-black p-[1px] flex items-center">
                  <div class="w-3 h-full bg-black rounded-[1px]"></div>
                </div>
                <div class="w-[1.5px] h-1 bg-black rounded-r-[1px]"></div>
              </div>
            </div>
          </div>

          <!-- Screen Content Area with Wireframe Background -->
          <div id="screen-canvas" class="relative flex-1 w-full overflow-hidden bg-white wireframe-grid">
            
            <!-- ======================================================== -->
            <!-- PAGINA 1: Con dentro SOLO un bottone con scritto "avanti"-->
            <!-- ======================================================== -->
            <div id="page-1" class="page-slide page-visible absolute inset-0 flex flex-col items-center justify-center p-6">
              <button
                id="btn-avanti"
                type="button"
                class="group relative inline-flex items-center justify-center gap-3 px-10 py-4 min-h-[52px] bg-white text-black font-semibold text-lg tracking-wide border-2 border-black rounded-lg shadow-[4px_4px_0px_0px_#000] hover:bg-neutral-50 active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0px_0px_#000] transition-all cursor-pointer"
                aria-label="Vai a Pagina 2"
              >
                <span>avanti</span>
                <svg class="w-5 h-5 text-black transition-transform group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
              </button>
            </div>

            <!-- ========================================================== -->
            <!-- PAGINA 2: Con dentro SOLO un bottone con scritto "indietro"-->
            <!-- ========================================================== -->
            <div id="page-2" class="page-slide page-hidden-right absolute inset-0 flex flex-col items-center justify-center p-6">
              <button
                id="btn-indietro"
                type="button"
                class="group relative inline-flex items-center justify-center gap-3 px-10 py-4 min-h-[52px] bg-white text-black font-semibold text-lg tracking-wide border-2 border-black rounded-lg shadow-[4px_4px_0px_0px_#000] hover:bg-neutral-50 active:translate-x-1 active:translate-y-1 active:shadow-[1px_1px_0px_0px_#000] transition-all cursor-pointer"
                aria-label="Torna a Pagina 1"
              >
                <svg class="w-5 h-5 text-black transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                <span>indietro</span>
              </button>
            </div>

          </div>

          <!-- Bottom iOS Home Indicator Area -->
          <div class="relative z-30 pt-2 pb-2 bg-white flex items-center justify-center">
            <div class="w-36 h-[4.5px] bg-black rounded-full"></div>
          </div>

        </div>
      </div>
    </main>

    <!-- Footer Specs -->
    <footer class="w-full max-w-5xl text-center text-xs text-neutral-600 font-mono mt-2 py-2 border-t border-neutral-300 flex flex-wrap items-center justify-between gap-2 px-2">
      <div class="flex items-center gap-2">
        <span class="inline-block w-2 h-2 rounded-full border border-black bg-white"></span>
        <span>Wireframe B&amp;W Minimalista • Solo bottoni di navigazione</span>
      </div>
      <div class="flex items-center gap-4 text-[11px] text-neutral-500">
        <span>Navigazione rapida: <kbd class="px-1.5 py-0.5 border border-black rounded bg-white text-black font-semibold">←</kbd> / <kbd class="px-1.5 py-0.5 border border-black rounded bg-white text-black font-semibold">→</kbd></span>
      </div>
    </footer>

    <!-- Native Vanilla JavaScript Navigation and Controls -->
    <script>
      (function() {
        let currentPage = 1;
        let scale = 0.85;
        let showGrid = true;

        const page1 = document.getElementById('page-1');
        const page2 = document.getElementById('page-2');
        const pageStatus = document.getElementById('page-status');
        const btnAvanti = document.getElementById('btn-avanti');
        const btnIndietro = document.getElementById('btn-indietro');
        const btnToggleGrid = document.getElementById('btn-toggle-grid');
        const screenCanvas = document.getElementById('screen-canvas');
        const iphoneWrapper = document.getElementById('iphone-wrapper');
        const zoomLabel = document.getElementById('zoom-label');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnZoomReset = document.getElementById('btn-zoom-reset');

        function goToPage(page) {
          if (page === currentPage) return;

          if (page === 2) {
            // Pagina 1 slides left and disappears
            page1.classList.remove('page-visible', 'page-hidden-right');
            page1.classList.add('page-hidden-left');

            // Pagina 2 comes in from right
            page2.classList.remove('page-hidden-left', 'page-hidden-right');
            page2.classList.add('page-visible');

            currentPage = 2;
            pageStatus.textContent = 'Pagina 2 di 2';
          } else {
            // Pagina 2 slides right and disappears
            page2.classList.remove('page-visible', 'page-hidden-left');
            page2.classList.add('page-hidden-right');

            // Pagina 1 comes in from left
            page1.classList.remove('page-hidden-left', 'page-hidden-right');
            page1.classList.add('page-visible');

            currentPage = 1;
            pageStatus.textContent = 'Pagina 1 di 2';
          }
        }

        btnAvanti.addEventListener('click', function() {
          goToPage(2);
        });

        btnIndietro.addEventListener('click', function() {
          goToPage(1);
        });

        // Keyboard arrow navigation
        window.addEventListener('keydown', function(e) {
          if ((e.key === 'ArrowRight' || e.key === 'Enter') && currentPage === 1) {
            goToPage(2);
          } else if ((e.key === 'ArrowLeft' || e.key === 'Backspace') && currentPage === 2) {
            goToPage(1);
          }
        });

        // Grid toggle
        btnToggleGrid.addEventListener('click', function() {
          showGrid = !showGrid;
          if (showGrid) {
            screenCanvas.classList.add('wireframe-grid');
            btnToggleGrid.className = 'flex items-center gap-1.5 px-2.5 py-1.5 border-2 border-black rounded transition-all active:translate-x-0.5 active:translate-y-0.5 bg-black text-white shadow-[2px_2px_0px_0px_#888]';
          } else {
            screenCanvas.classList.remove('wireframe-grid');
            btnToggleGrid.className = 'flex items-center gap-1.5 px-2.5 py-1.5 border-2 border-black rounded transition-all active:translate-x-0.5 active:translate-y-0.5 bg-white text-black shadow-[2px_2px_0px_0px_#000] hover:bg-neutral-50';
          }
        });

        // Zoom logic
        function setDeviceScale(newScale) {
          scale = Math.min(1.1, Math.max(0.55, Number(newScale.toFixed(2))));
          iphoneWrapper.style.transform = 'scale(' + scale + ')';
          zoomLabel.textContent = Math.round(scale * 100) + '%';
        }

        btnZoomIn.addEventListener('click', function() {
          setDeviceScale(scale + 0.1);
        });

        btnZoomOut.addEventListener('click', function() {
          setDeviceScale(scale - 0.1);
        });

        btnZoomReset.addEventListener('click', function() {
          setDeviceScale(0.85);
        });

        // Auto-scale on window resize
        function autoScale() {
          var vh = window.innerHeight;
          if (vh < 700) {
            setDeviceScale(0.65);
          } else if (vh < 920) {
            setDeviceScale(0.78);
          } else if (vh < 1100) {
            setDeviceScale(0.88);
          } else {
            setDeviceScale(1.0);
          }
        }
        autoScale();
        window.addEventListener('resize', autoScale);
      })();
    </script>
  </body>
</html>
